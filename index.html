<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>CityFix | Report Civic Issues</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', system-ui, 'Segoe UI', sans-serif; }
    :root {
      --bg: #f5f5f0; --card: #ffffff; --text: #111; --primary: #7b1e3a;
      --secondary: #1d4d3d; --accent: #c6a15b; --input: #f0f0f0; --border: #ddd9cc;
    }
    .dark { --bg: #08110f; --card: #101b18; --text: #fff; --primary: #8f2347; --secondary: #295d4b; --accent: #d4b16a; --input: #172420; --border: #25332e; }
    body { background: var(--bg); color: var(--text); transition: 0.3s; }
    body[dir="rtl"] { text-align: right; }
    .container { max-width: 1000px; margin: auto; padding: 20px; }
    .nav { display: flex; justify-content: space-between; align-items: center; padding: 20px 0; flex-wrap: wrap; gap: 15px; }
    .logo { font-size: 44px; font-weight: 800; color: var(--primary); }
    .toggle-group { display: flex; gap: 12px; }
    .toggle-btn { background: var(--input); border: 1px solid var(--border); padding: 10px 16px; border-radius: 40px; cursor: pointer; font-weight: 600; }
    .hero { text-align: center; padding: 40px 0 20px; }
    .hero h1 { font-size: 52px; background: linear-gradient(135deg, var(--primary), var(--secondary)); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .card { background: var(--card); padding: 28px; border-radius: 28px; margin-top: 24px; border: 1px solid var(--border); }
    input, textarea, select { width: 100%; padding: 16px; margin-top: 14px; border: none; border-radius: 16px; background: var(--input); color: var(--text); }
    textarea { min-height: 120px; resize: vertical; }
    button { width: 100%; padding: 16px; margin-top: 15px; border: none; border-radius: 16px; background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; font-weight: 700; cursor: pointer; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .preview { width: 100%; margin-top: 14px; border-radius: 18px; display: none; }
    .status-badge { display: inline-block; padding: 6px 14px; border-radius: 20px; font-weight: 700; font-size: 0.85rem; }
    .status-Pending { background: #e67e22; color: white; }
    .status-In-Progress { background: #3498db; color: white; }
    .status-Resolved { background: #27ae60; color: white; }
    .complaint-list-item { background: var(--input); padding: 16px; border-radius: 20px; margin-bottom: 12px; border-left: 3px solid var(--accent); cursor: pointer; }
    .track-result-card { background: var(--card); padding: 18px; border-radius: 24px; margin-top: 15px; border: 1px solid var(--accent); }
    .gps-hint { font-size: 12px; color: var(--accent); margin-top: 8px; text-align: center; }
    .live-badge { background: #27ae60; font-size: 10px; padding: 2px 8px; border-radius: 20px; margin-left: 10px; animation: pulse 1.5s infinite; color: white; }
    @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }
    .toast-notification { position: fixed; top: 80px; right: 20px; background: var(--card); color: var(--text); padding: 14px 22px; border-radius: 20px; display: none; z-index: 9999; border-left: 4px solid #27ae60; }
    @media (max-width: 700px) { .hero h1 { font-size: 36px; } .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<div class="container">
  <div class="nav">
    <div class="logo">🏙️ CityFix</div>
    <div class="toggle-group">
      <button class="toggle-btn" id="langToggleBtn" onclick="toggleLanguage()">🇦🇪 العربية</button>
      <button class="toggle-btn" onclick="toggleTheme()">🌗 Theme</button>
    </div>
  </div>
  <div class="hero">
    <h1 id="heroTitle">Report & Track<br>Civic Issues</h1>
    <p id="heroSub">Your voice builds better cities — transparent, accountable, fast.</p>
  </div>
  <div id="toastNotification" class="toast-notification"></div>

  <div class="card">
    <h2 id="reportTitle">📝 Report an Issue</h2>
    <input id="name" placeholder="Your Name (required)">
    <input id="phone" type="tel" placeholder="📞 Phone Number (optional)">
    <select id="category">
      <option id="defaultOption" value="" disabled selected>🔽 Select an issue type</option>
      <optgroup id="emergencyGroup" label="🚨 EMERGENCY / CRITICAL">
        <option value="Fire Hazard">🚨 Fire Hazard</option>
        <option value="Building Collapse Risk">🏚️ Building Collapse Risk</option>
        <option value="Flooding/Waterlogging">🌊 Flooding</option>
        <option value="Gas Leak">💨 Gas Leak</option>
        <option value="Open Manholes (Safety Hazard)">⚠️ Open Manholes</option>
      </optgroup>
      <optgroup id="infraGroup" label="🏗️ INFRASTRUCTURE">
        <option value="Roads & Potholes">🛣️ Roads & Potholes</option>
        <option value="Drainage/Stormwater Blockage">💧 Drainage Blockage</option>
        <option value="Footpath Damage">👣 Footpath Damage</option>
        <option value="Building Violations">🏗️ Building Violations</option>
      </optgroup>
      <optgroup id="utilsGroup" label="💧 UTILITIES">
        <option value="Water Supply">🚰 Water Supply</option>
        <option value="Electricity">⚡ Electricity</option>
        <option value="Sewage Blockage">🚽 Sewage Blockage</option>
        <option value="Street Light Outage">💡 Street Light Outage</option>
      </optgroup>
      <optgroup id="transportGroup" label="🚦 TRANSPORT & SAFETY">
        <option value="Safety & Lighting">🔦 Safety & Lighting</option>
        <option value="Traffic Signal Malfunction">🚥 Traffic Signal Malfunction</option>
        <option value="Stray Animals">🐕 Stray Animals</option>
        <option value="Missing Manhole Cover">🔘 Missing Manhole Cover</option>
        <option value="Abandoned Vehicles">🚗 Abandoned Vehicles</option>
      </optgroup>
      <optgroup id="cleanGroup" label="🧹 CLEANLINESS">
        <option value="Cleanliness & Waste">🗑️ Cleanliness & Waste</option>
        <option value="Illegal Dumping">🚛 Illegal Dumping</option>
        <option value="Overflowing Bins">🗑️ Overflowing Bins</option>
      </optgroup>
      <optgroup id="envGroup" label="🌳 ENVIRONMENT">
        <option value="Tree Fall/Dangerous Trees">🌲 Tree Fall</option>
        <option value="Air Pollution">🌫️ Air Pollution</option>
        <option value="Noise Pollution">🔊 Noise Pollution</option>
        <option value="Mosquito Infestation">🦟 Mosquito Infestation</option>
      </optgroup>
      <optgroup id="digitalGroup" label="📡 DIGITAL">
        <option value="Public WiFi Not Working">📶 WiFi Issue</option>
        <option value="Government Website Down">💻 Website Down</option>
      </optgroup>
      <optgroup id="otherGroup" label="📋 OTHER">
        <option value="Others">📋 Others</option>
      </optgroup>
    </select>
    <textarea id="description" placeholder="Describe the issue in detail..."></textarea>
    <input id="location" placeholder="📍 Location">
    <div class="grid">
      <button id="gpsBtn" onclick="useGPS()">📍 Detect Location</button>
      <button id="clearBtn" onclick="clearForm()">🗑️ Clear</button>
    </div>
    <div class="gps-hint" id="gpsHint">💡 Click "Detect Location" to auto-fill your address</div>
    <input type="file" id="photo" accept="image/*">
    <img id="preview" class="preview">
    <button id="submitBtn" onclick="submitComplaint()">🚀 Submit Report</button>
  </div>

  <div class="card">
    <h2 id="complaintsTitle">📋 Your Complaints <span class="live-badge">LIVE</span></h2>
    <div id="allComplaintsList">Loading...</div>
    <button id="refreshBtn" onclick="loadMyComplaints()" style="background: var(--input); color: var(--text); margin-top: 12px;">⟳ Refresh</button>
  </div>

  <div class="card">
    <h2 id="trackTitle">🔍 Track a Specific Complaint</h2>
    <p id="trackSub" style="margin-bottom: 10px;">Enter Case ID (e.g., CFX-001)</p>
    <input id="trackId" placeholder="Case ID">
    <button id="trackBtn" onclick="trackSpecificComplaint()">Track →</button>
    <div id="trackResult"></div>
  </div>
</div>

<script>
  const API_URL = "https://cityfix-backend-bq0n.onrender.com";
  let uploadedImage = "", deviceToken = null, updateInterval = null, previousStatusMap = {};
  let currentLang = localStorage.getItem("cityfix_lang") || "en";

  const translations = {
    en: {
      heroTitle: "Report & Track<br>Civic Issues", heroSub: "Your voice builds better cities — transparent, accountable, fast.",
      reportTitle: "📝 Report an Issue", namePlace: "Your Name (required)", phonePlace: "📞 Phone Number (optional)",
      descPlace: "Describe the issue in detail...", locPlace: "📍 Location", gpsBtn: "📍 Detect Location",
      clearBtn: "🗑️ Clear", gpsHint: "💡 Click \"Detect Location\" to auto-fill your address", submitBtn: "🚀 Submit Report",
      complaintsTitle: "📋 Your Complaints", refreshBtn: "⟳ Refresh", trackTitle: "🔍 Track a Specific Complaint",
      trackSub: "Enter Case ID (e.g., CFX-001)", trackPlace: "Case ID", trackBtn: "Track →",
      noReports: "No reports yet. Submit your first complaint above.", clickHint: "💡 Click any complaint to view full details",
      submitting: "Submitting...", submitted: "✅ Submitted! Case ID: ", error: "❌ Submission error",
      gpsSuccess: "📍 Location detected!", gpsAllow: "Allow location access", statusUpdate: "🔔 Status update for complaint"
    },
    ar: {
      heroTitle: "الإبلاغ عن المشكلات<br>وتتبعها", heroSub: "صوتك يبني مدناً أفضل — شفافية، مساءلة، وسرعة",
      reportTitle: "📝 الإبلاغ عن مشكلة", namePlace: "اسمك (مطلوب)", phonePlace: "📞 رقم الهاتف (اختياري)",
      descPlace: "صف المشكلة بالتفصيل...", locPlace: "📍 الموقع", gpsBtn: "📍 تحديد الموقع",
      clearBtn: "🗑️ مسح", gpsHint: "💡 اضغط \"تحديد الموقع\" لملء عنوانك تلقائياً", submitBtn: "🚀 إرسال البلاغ",
      complaintsTitle: "📋 بلاغاتك", refreshBtn: "⟳ تحديث", trackTitle: "🔍 تتبع بلاغ محدد",
      trackSub: "أدخل معرف البلاغ (مثال: CFX-001)", trackPlace: "معرف البلاغ", trackBtn: "تتبع ←",
      noReports: "📭 لا توجد بلاغات بعد. أرسل بلاغك الأول أعلاه.", clickHint: "💡 اضغط على أي بلاغ لعرض التفاصيل",
      submitting: "جاري الإرسال...", submitted: "✅ تم الإرسال! معرف البلاغ: ", error: "❌ خطأ في الإرسال",
      gpsSuccess: "📍 تم تحديد الموقع!", gpsAllow: "اسمح بالوصول للموقع", statusUpdate: "🔔 تحديث حالة البلاغ"
    }
  };

  const categoryMap = {
    "Select an issue type": { en: "🔽 Select an issue type", ar: "🔽 اختر نوع المشكلة" },
    "Fire Hazard": { en: "🚨 Fire Hazard", ar: "🚨 خطر حريق" },
    "Building Collapse Risk": { en: "🏚️ Building Collapse Risk", ar: "🏚️ خطر انهيار مبنى" },
    "Flooding/Waterlogging": { en: "🌊 Flooding", ar: "🌊 فيضانات" },
    "Gas Leak": { en: "💨 Gas Leak", ar: "💨 تسرب غاز" },
    "Open Manholes (Safety Hazard)": { en: "⚠️ Open Manholes", ar: "⚠️ فتحات صرف مكشوفة" },
    "Roads & Potholes": { en: "🛣️ Roads & Potholes", ar: "🛣️ الطرق والحفر" },
    "Drainage/Stormwater Blockage": { en: "💧 Drainage Blockage", ar: "💧 انسداد الصرف" },
    "Footpath Damage": { en: "👣 Footpath Damage", ar: "👣 تلف الأرصفة" },
    "Building Violations": { en: "🏗️ Building Violations", ar: "🏗️ مخالفات البناء" },
    "Water Supply": { en: "🚰 Water Supply", ar: "🚰 إمدادات المياه" },
    "Electricity": { en: "⚡ Electricity", ar: "⚡ الكهرباء" },
    "Sewage Blockage": { en: "🚽 Sewage Blockage", ar: "🚽 انسداد المجاري" },
    "Street Light Outage": { en: "💡 Street Light Outage", ar: "💡 انطفاء أعمدة الإنارة" },
    "Safety & Lighting": { en: "🔦 Safety & Lighting", ar: "🔦 السلامة والإضاءة" },
    "Traffic Signal Malfunction": { en: "🚥 Traffic Signal Malfunction", ar: "🚥 عطل إشارة المرور" },
    "Stray Animals": { en: "🐕 Stray Animals", ar: "🐕 حيوانات ضالة" },
    "Missing Manhole Cover": { en: "🔘 Missing Manhole Cover", ar: "🔘 غياب غطاء فتحة الصرف" },
    "Abandoned Vehicles": { en: "🚗 Abandoned Vehicles", ar: "🚗 مركبات مهجورة" },
    "Cleanliness & Waste": { en: "🗑️ Cleanliness & Waste", ar: "🗑️ النظافة والنفايات" },
    "Illegal Dumping": { en: "🚛 Illegal Dumping", ar: "🚛 رمي النفايات غير القانوني" },
    "Overflowing Bins": { en: "🗑️ Overflowing Bins", ar: "🗑️ حاويات ممتلئة" },
    "Tree Fall/Dangerous Trees": { en: "🌲 Tree Fall", ar: "🌲 سقوط الأشجار" },
    "Air Pollution": { en: "🌫️ Air Pollution", ar: "🌫️ تلوث الهواء" },
    "Noise Pollution": { en: "🔊 Noise Pollution", ar: "🔊 تلوث ضوضائي" },
    "Mosquito Infestation": { en: "🦟 Mosquito Infestation", ar: "🦟 انتشار البعوض" },
    "Public WiFi Not Working": { en: "📶 WiFi Issue", ar: "📶 واي فاي لا يعمل" },
    "Government Website Down": { en: "💻 Website Down", ar: "💻 تعطل موقع حكومي" },
    "Others": { en: "📋 Others", ar: "📋 أخرى" }
  };

  const optgroupLabels = {
    emergencyGroup: { en: "🚨 EMERGENCY / CRITICAL", ar: "🚨 طوارئ / حرجة" },
    infraGroup: { en: "🏗️ INFRASTRUCTURE", ar: "🏗️ البنية التحتية" },
    utilsGroup: { en: "💧 UTILITIES", ar: "💧 المرافق" },
    transportGroup: { en: "🚦 TRANSPORT & SAFETY", ar: "🚦 النقل والسلامة" },
    cleanGroup: { en: "🧹 CLEANLINESS", ar: "🧹 النظافة" },
    envGroup: { en: "🌳 ENVIRONMENT", ar: "🌳 البيئة" },
    digitalGroup: { en: "📡 DIGITAL", ar: "📡 الرقمية" },
    otherGroup: { en: "📋 OTHER", ar: "📋 أخرى" }
  };

  function setLanguage(lang) {
    currentLang = lang;
    localStorage.setItem("cityfix_lang", lang);
    document.documentElement.lang = lang === "en" ? "en" : "ar";
    document.body.dir = lang === "en" ? "ltr" : "rtl";
    document.getElementById("langToggleBtn").innerText = lang === "en" ? "🇦🇪 العربية" : "🇬🇧 English";

    const t = translations[lang];
    document.getElementById("heroTitle").innerHTML = t.heroTitle;
    document.getElementById("heroSub").innerText = t.heroSub;
    document.getElementById("reportTitle").innerHTML = t.reportTitle;
    document.getElementById("name").placeholder = t.namePlace;
    document.getElementById("phone").placeholder = t.phonePlace;
    document.getElementById("description").placeholder = t.descPlace;
    document.getElementById("location").placeholder = t.locPlace;
    document.getElementById("gpsBtn").innerText = t.gpsBtn;
    document.getElementById("clearBtn").innerText = t.clearBtn;
    document.getElementById("gpsHint").innerText = t.gpsHint;
    document.getElementById("submitBtn").innerText = t.submitBtn;
    document.getElementById("complaintsTitle").innerHTML = t.complaintsTitle + ' <span class="live-badge">LIVE</span>';
    document.getElementById("refreshBtn").innerText = t.refreshBtn;
    document.getElementById("trackTitle").innerHTML = t.trackTitle;
    document.getElementById("trackSub").innerText = t.trackSub;
    document.getElementById("trackId").placeholder = t.trackPlace;
    document.getElementById("trackBtn").innerText = t.trackBtn;

    // Update optgroup labels
    for (const [id, labels] of Object.entries(optgroupLabels)) {
      const el = document.getElementById(id);
      if (el) el.label = labels[lang];
    }

    // Update category options
    const options = document.querySelectorAll("#category option");
    options.forEach(opt => {
      const val = opt.value;
      if (categoryMap[val]) opt.innerText = categoryMap[val][lang];
    });
  }

  function toggleLanguage() { setLanguage(currentLang === "en" ? "ar" : "en"); loadMyComplaints(); }
  function toggleTheme() { document.body.classList.toggle("dark"); localStorage.setItem("theme", document.body.classList.contains("dark") ? "dark" : "light"); }
  if (localStorage.getItem("theme") === "dark") document.body.classList.add("dark");
  setLanguage(currentLang);

  function showToast(msg) { const toast = document.getElementById("toastNotification"); toast.innerHTML = msg; toast.style.display = "block"; setTimeout(() => toast.style.display = "none", 4000); }

  function getDeviceToken() { let token = localStorage.getItem("deviceToken"); if (!token) { token = Math.random().toString(36).substring(2, 20); localStorage.setItem("deviceToken", token); } return token; }
  deviceToken = getDeviceToken();

  document.getElementById("photo")?.addEventListener("change", function(e) {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => { uploadedImage = ev.target.result; document.getElementById("preview").src = uploadedImage; document.getElementById("preview").style.display = "block"; };
    reader.readAsDataURL(file);
  });

  async function useGPS() {
    if (!navigator.geolocation) return showToast(translations[currentLang].gpsAllow);
    navigator.geolocation.getCurrentPosition(async (pos) => {
      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${pos.coords.latitude}&lon=${pos.coords.longitude}`);
        const data = await res.json();
        document.getElementById("location").value = data.display_name;
        showToast(translations[currentLang].gpsSuccess);
      } catch(e) { showToast(translations[currentLang].gpsSuccess); }
    });
  }

  function clearForm() {
    document.getElementById("name").value = "";
    document.getElementById("phone").value = "";
    document.getElementById("description").value = "";
    document.getElementById("location").value = "";
    document.getElementById("photo").value = "";
    document.getElementById("preview").style.display = "none";
    uploadedImage = "";
  }

  async function submitComplaint() {
    const name = document.getElementById("name").value.trim();
    if (!name) { showToast(translations[currentLang].namePlace.replace("(required)", "is required")); return; }
    const btn = document.getElementById("submitBtn");
    btn.disabled = true; btn.innerText = translations[currentLang].submitting;
    const complaint = {
      name, phone: document.getElementById("phone").value || "",
      category: document.getElementById("category").value,
      description: document.getElementById("description").value,
      location: document.getElementById("location").value,
      photo: uploadedImage, deviceToken
    };
    try {
      const res = await fetch(`${API_URL}/api/complaints`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(complaint) });
      const data = await res.json();
      const tokens = JSON.parse(localStorage.getItem("complaintTokens") || "{}");
      tokens[data.id] = data.privateToken;
      localStorage.setItem("complaintTokens", JSON.stringify(tokens));
      showToast(`${translations[currentLang].submitted}${data.id}`);
      clearForm(); loadMyComplaints();
    } catch(err) { showToast(translations[currentLang].error); }
    btn.disabled = false; btn.innerText = translations[currentLang].submitBtn;
  }

  async function loadMyComplaints() {
    try {
      const res = await fetch(`${API_URL}/api/my-complaints`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ deviceToken }) });
      const complaints = await res.json();
      const container = document.getElementById("allComplaintsList");
      if (complaints.length === 0) { container.innerHTML = `<p style="text-align:center; padding:20px;">${translations[currentLang].noReports}</p>`; return; }
      complaints.sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
      container.innerHTML = complaints.map(c => `
        <div class="complaint-list-item" onclick="viewComplaintDetails('${c.id}')">
          <div style="display: flex; justify-content: space-between;">
            <strong>📌 ${c.category}</strong>
            <span class="status-badge status-${c.status.replace(/ /g, '-')}">${c.status}</span>
          </div>
          <p style="margin-top: 8px;">${c.description.substring(0, 80)}...</p>
          <small>📍 ${c.location.substring(0, 60)} | ID: ${c.id}</small>
        </div>
      `).join("");
      container.innerHTML += `<p style="font-size: 11px; margin-top: 8px; text-align:center;">${translations[currentLang].clickHint}</p>`;
    } catch(e) { console.error(e); }
  }

  async function viewComplaintDetails(id) {
    const tokens = JSON.parse(localStorage.getItem("complaintTokens") || "{}");
    const token = tokens[id];
    if (!token) { showToast("Cannot access details"); return; }
    try {
      const res = await fetch(`${API_URL}/api/complaint/${id}/${token}`);
      const c = await res.json();
      const phoneHtml = c.phone ? `<p><strong>📞 Phone:</strong> ${c.phone}</p>` : '';
      document.getElementById("trackResult").innerHTML = `
        <div class="track-result-card">
          <h3>📌 ${c.category}</h3>
          <p><strong>Name:</strong> ${c.name}</p>${phoneHtml}
          <p><strong>Description:</strong> ${c.description}</p>
          <p><strong>📍 Location:</strong> ${c.location}</p>
          <p><strong>📅 Reported:</strong> ${new Date(c.createdAt).toLocaleString()}</p>
          <p><strong>🔄 Status:</strong> <span class="status-badge status-${c.status.replace(/ /g, '-')}">${c.status}</span></p>
          ${c.photo ? `<img src="${c.photo}" style="max-width:100%; border-radius:16px; margin-top:12px;">` : ""}
        </div>`;
      document.getElementById("trackResult").scrollIntoView({ behavior: "smooth" });
    } catch(e) { showToast("Error loading details"); }
  }

  async function trackSpecificComplaint() {
    const id = document.getElementById("trackId").value.trim();
    if (!id) { showToast("Enter a Case ID"); return; }
    const tokens = JSON.parse(localStorage.getItem("complaintTokens") || "{}");
    const token = tokens[id];
    if (!token) { document.getElementById("trackResult").innerHTML = `<p style="color:#e74c3c;">❌ You can only track complaints you submitted from this device.</p>`; return; }
    try {
      const res = await fetch(`${API_URL}/api/complaint/${id}/${token}`);
      const c = await res.json();
      const phoneHtml = c.phone ? `<p><strong>📞 Phone:</strong> ${c.phone}</p>` : '';
      document.getElementById("trackResult").innerHTML = `
        <div class="track-result-card">
          <h3>📌 ${c.category}</h3>
          <p><strong>Name:</strong> ${c.name}</p>${phoneHtml}
          <p><strong>Description:</strong> ${c.description}</p>
          <p><strong>📍 Location:</strong> ${c.location}</p>
          <p><strong>📅 Reported:</strong> ${new Date(c.createdAt).toLocaleString()}</p>
          <p><strong>🔄 Status:</strong> <span class="status-badge status-${c.status.replace(/ /g, '-')}">${c.status}</span></p>
          ${c.photo ? `<img src="${c.photo}" style="max-width:100%; border-radius:16px; margin-top:12px;">` : ""}
        </div>`;
    } catch(e) { document.getElementById("trackResult").innerHTML = `<p style="color:#e74c3c;">❌ Complaint not found</p>`; }
  }

  async function checkStatusUpdates() {
    const tokens = JSON.parse(localStorage.getItem("complaintTokens") || "{}");
    for (const [id, token] of Object.entries(tokens)) {
      try {
        const res = await fetch(`${API_URL}/api/complaint/${id}/${token}`);
        const data = await res.json();
        if (previousStatusMap[id] && previousStatusMap[id] !== data.status) {
          showToast(`${translations[currentLang].statusUpdate} ${id}: ${data.status}`);
        }
        previousStatusMap[id] = data.status;
      } catch(e) {}
    }
    loadMyComplaints();
  }
  setInterval(checkStatusUpdates, 5000);
  loadMyComplaints();
</script>
</body>
</html>
